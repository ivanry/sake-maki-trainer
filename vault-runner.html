<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaultrunner Remix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE7DD; --panel:#FFFFFF; --panel2:#F5F1E9; --ink:#1E1A16; --muted:#6A6258; --line:#D9D1C4; --accent:#C98A12; --accent-ink:#2A1B00;
  --scrim:rgba(236,231,221,.92); --frame:#5A626D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1017; --panel:#171A24; --panel2:#1E2230; --ink:#ECE7DE; --muted:#9A9387; --line:#2A2F3D; --accent:#E8B04A; --accent-ink:#241700;
    --scrim:rgba(14,16,23,.9); --frame:#3C424D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1017; --panel:#171A24; --panel2:#1E2230; --ink:#ECE7DE; --muted:#9A9387; --line:#2A2F3D; --accent:#E8B04A; --accent-ink:#241700;
  --scrim:rgba(14,16,23,.9); --frame:#3C424D;
  color-scheme:dark;
}
/* touch devices get a dark console around the board so the game is the only bright thing */
:root[data-ui="touch"]:root:root{
  --bg:#121721; --panel:#1C2330; --panel2:#242D3D; --ink:#EEF2F8; --muted:#8F9CB2; --line:#2B3546; --accent:#E8B04A; --accent-ink:#241700;
  --scrim:rgba(12,16,24,.88); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
:root[data-ui="touch"] body{overflow:hidden;overscroll-behavior:none;background:radial-gradient(130% 100% at 50% 45%, #1B2231, #0E1219)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{width:100%;height:100%;visibility:hidden;-webkit-touch-callout:none}
.app.ready{visibility:visible}
:root[data-ui="touch"] .app{-webkit-user-select:none;user-select:none}

/* ---------- shared pieces ---------- */
.brand{font-family:"Silkscreen","Chakra Petch",monospace;font-weight:700;font-size:1.5rem;letter-spacing:.02em;line-height:1;white-space:nowrap}
.brand span{color:var(--accent)}
.topbar{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px}
.hud{margin:0;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hud > div{display:flex;flex-direction:row;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;line-height:1}
.hud dt{display:flex;align-items:center;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.04em}
.hud dt svg{width:16px;height:16px}
.hud dd{margin:0;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.hud .h-lives dt{color:#FF5C6C}
.hud .h-gold dt{color:#E2A71E}
.hud .h-score dt{color:#4C9BE8}
.hud .h-par dt{color:#9AA7B5}
.hud .h-par.over dd{color:var(--muted)}
.hud .h-par dd small{font-size:.72rem;color:var(--muted);font-weight:700}
.hud .h-inv{display:contents}
.hud .h-inv:empty{display:none}
.invb{font:inherit;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;cursor:pointer;line-height:1}
.invb canvas{width:22px;height:22px}
.invb kbd{font:inherit;font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px}
:root[data-ui="touch"] .invb kbd{display:none}
.stars{font-style:normal;color:#E8A317;letter-spacing:1px;font-size:.78rem;line-height:1}
.stars .off{color:var(--line)}
.hud .h-time dt{color:#FFB020}
.hud > div[hidden]{display:none}
.hud .h-time.low{border-color:#E5484D}
.hud .h-time.low dd{color:#E5484D}
.levels .wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px;border-color:var(--accent)}
.levels .wide small{font-size:.8rem}
.hud dd.pulse{animation:pulse .8s ease-out}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.7);color:#FF5C6C}100%{transform:scale(1)}}
.board-wrap{position:relative;flex:none;width:var(--bw,480px);height:var(--bh,320px);border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px var(--frame),0 12px 34px rgba(0,0,0,.28);container-type:size}
canvas#game{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;background:var(--scrim);overflow:auto}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-family:"Silkscreen","Chakra Petch",monospace;font-weight:700;font-size:clamp(1.1rem, 6cqmin, 2.3rem)}
.overlay p{margin:0;color:var(--muted);max-width:48ch;line-height:1.45;font-size:clamp(.8rem, 3.2cqmin, 1.02rem)}
.overlay p b{color:var(--ink)}
.ovrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-weight:700;font-size:1rem;padding:10px 24px;border-radius:8px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink)}
.btn[hidden]{display:none}
.fly{position:fixed;left:0;top:0;z-index:80;pointer-events:none;font-size:30px;line-height:1;color:#FF5C6C;filter:drop-shadow(0 2px 6px rgba(255,92,108,.6))}

/* ---------- side panel (desktop) / menu sheet (touch) ---------- */
.side{display:flex;flex-direction:column;gap:14px}
.side h3{margin:0 0 6px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.lvb{font:inherit;font-weight:700;font-size:1.05rem;width:26px;height:26px;border-radius:50%;border:0;background:var(--panel2);color:var(--ink);cursor:pointer;line-height:1;padding:0;display:grid;place-items:center}
.lvb:hover{background:var(--line)}
.lvb:disabled{opacity:.3;cursor:default}
.hud .h-lvl{padding:3px 4px}
:root[data-ui="touch"] .lvb,:root[data-ui="touch"] .deskonly{display:none}
:root[data-ui="touch"] .hud .h-lvl{padding:5px 11px 5px 8px}
:root[data-ui="desk"] .lvstep,:root[data-ui="desk"] #swapSides,:root[data-ui="desk"] #restartBtn{display:none}
:root[data-ui="desk"] .topbar{gap:10px}
:root[data-ui="desk"] .topbar .hud{margin-left:auto}
.guidebox summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.guidebox summary::-webkit-details-marker{display:none}
.guidebox summary::after{content:"▾";color:var(--muted);font-size:.9rem;transition:transform .2s}
.guidebox[open] summary::after{transform:rotate(180deg)}
.guidebox summary h3{margin:0}
.guidebox[open] .gl{margin-top:10px}
.lvstep{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px;margin-bottom:10px;width:max-content}
.lvstep button{font-weight:700;font-size:1.15rem;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;line-height:1}
.lvstep button:hover{background:var(--line)}
.lvstep button:disabled{opacity:.3;cursor:default;background:transparent}
.lvstep span{font-weight:700;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.levels button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:0}
.levels button b{font-size:1rem}
.levels button small{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.levels button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.levels button:disabled{opacity:.4;cursor:default}
.looks{display:flex;flex-wrap:wrap;gap:5px}
.looks button{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;cursor:pointer;border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:4px 10px 4px 5px}
.looks button[aria-checked="true"]{border-color:var(--ink);color:var(--ink)}
.looks .chip{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.switch{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:transparent;color:var(--ink);padding:2px 0}
.switch .track{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background-color .2s;flex:none}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] .track{background:#17A398}
.switch[aria-checked="true"] .knob{transform:translateX(18px)}
.small{font-weight:700;font-size:.88rem;padding:7px 12px;border-radius:8px;cursor:pointer;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink)}
.bestline{font-size:.88rem;color:var(--muted);margin:0}
.bestline b{color:var(--ink)}
.gl{display:grid;grid-template-columns:1fr;gap:8px}
.gi{display:flex;gap:10px;align-items:flex-start}
.gi canvas{width:40px;height:40px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.gi b{font-size:.92rem}
.gi p{margin:1px 0 0;font-size:.83rem;color:var(--muted);line-height:1.35}
.keys{color:var(--muted);font-size:.86rem;line-height:1.7;margin:0}
.keys p{margin:0}
.keys .tips{margin-top:6px;font-size:.82rem;line-height:1.55}
.keys .tips b{color:var(--ink)}
kbd{font:inherit;font-weight:700;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* ---------- desktop layout ---------- */
:root[data-ui="desk"] .app{display:grid;grid-template-columns:var(--bw) 340px;grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "board side" "keys side";
  gap:12px 18px;justify-content:center;align-content:start;padding:14px 16px 20px;height:auto;min-height:100%}
:root[data-ui="desk"] .topbar{grid-area:top;justify-content:space-between}
:root[data-ui="desk"] #menuBtn{display:none}
:root[data-ui="desk"] .board-wrap{grid-area:board}
:root[data-ui="desk"] .side{grid-area:side;max-height:calc(var(--bh) + 60px);overflow:auto;padding-right:2px}
:root[data-ui="desk"] .keys{grid-area:keys}
:root[data-ui="desk"] #guideBox{display:none}
.manual{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;color:var(--ink);font-size:.9rem;line-height:1.4}
.manual summary{font-weight:700;cursor:pointer;font-size:1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.manual summary::-webkit-details-marker{display:none}
.manual summary::after{content:"\25BE";color:var(--muted);transition:transform .2s}
.manual[open] summary::after{transform:rotate(180deg)}
.manual h4{margin:14px 0 8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px 16px}
.mcard{display:flex;gap:10px;align-items:flex-start}
.mcard canvas{width:44px;height:44px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mcard b{font-size:.9rem}
.mcard p{margin:2px 0 0;font-size:.8rem;color:var(--muted);line-height:1.35}
.mlv{display:inline-block;font-size:.66rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:7px 16px}
.kitem{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.kitem .kk{display:flex;gap:3px;flex:none;min-width:72px}
.kitem kbd{min-width:22px;text-align:center}
:root[data-ui="desk"] .ctl,:root[data-ui="desk"] .tbrand{display:none}
@media (max-width:760px){ :root[data-ui="desk"] .app{grid-template-columns:var(--bw);grid-template-areas:"top" "board" "keys" "side"} :root[data-ui="desk"] .side{max-height:none} :root[data-ui="desk"] .topbar{flex-wrap:wrap} }

/* ---------- touch layout ---------- */
:root[data-ui="touch"] .keys,:root[data-ui="touch"] .dbrand{display:none}
:root[data-ui="touch"] .board-wrap{border-radius:10px;box-shadow:0 0 0 3px var(--frame),0 14px 40px rgba(0,0,0,.55)}
.ctl{position:relative;display:flex;touch-action:none}
.ctl.swap{flex-direction:row-reverse}
.joyzone{position:relative;flex:1;touch-action:none;min-width:0}
.joyhint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:.72rem;color:var(--muted);pointer-events:none;transition:opacity .3s}
.joybase{position:absolute;left:50%;top:50%;width:var(--joy,128px);height:var(--joy,128px);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.04) 0 52%, rgba(255,255,255,.09) 53% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);opacity:.6;pointer-events:none}
.joybase.on{opacity:1}
.joyknob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FFFFFF, #CBD3DF 60%, #9AA5B5);box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.15)}
.joyarrows{position:absolute;inset:0;pointer-events:none}
.joyarrows i{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.4}
.joyarrows .u{left:50%;top:7%;margin-left:-6px;border-bottom-color:#fff}
.joyarrows .d{left:50%;bottom:7%;margin-left:-6px;border-top-color:#fff}
.joyarrows .l{top:50%;left:7%;margin-top:-6px;border-right-color:#fff}
.joyarrows .r{top:50%;right:7%;margin-top:-6px;border-left-color:#fff}
.joyarrows i.hot{opacity:1;border-width:8px}
.btns{position:relative;touch-action:none;flex:1;min-width:0}
.rb{position:absolute;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font-weight:800;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 10px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .06s,box-shadow .06s;touch-action:none;
  width:var(--big,84px);height:var(--big,84px);bottom:10%;background:radial-gradient(circle at 35% 30%, #FFD36B, #E8A317 55%, #B57A08)}
.rb.on{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.rb svg{width:58%;height:58%}
.rb.dr{right:5%}
.rb.route{width:calc(var(--big,84px) * .56);height:calc(var(--big,84px) * .56);right:5%;bottom:calc(10% + var(--big,84px) + 22px);background:radial-gradient(circle at 35% 30%, #A6F5E4, #3DE0C0 55%, #1FA88E)}
.rb.route[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 18px rgba(61,224,192,.8)}
.ctl.swap .rb.route{right:auto;left:5%}
.ib.routeBtn[aria-pressed="true"]{background:#3DE0C0;border-color:#1FA88E;color:#0B2A24}
.rb.dl{right:calc(5% + var(--big,84px) + 12px);bottom:calc(10% + var(--big,84px) * .32)}
.ctl.swap .rb.dr{right:auto;left:calc(5% + var(--big,84px) + 12px);bottom:10%}
.ctl.swap .rb.dl{right:auto;left:5%;bottom:calc(10% + var(--big,84px) * .32)}
.rb small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap;font-weight:700}
:root[data-ui="touch"] .app[data-layout="land"]{display:grid;grid-template-columns:minmax(0,1fr) var(--bw) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"lt board rt" "lm board rm" "joy board btn";column-gap:10px;row-gap:6px;align-items:start;
  padding:6px calc(8px + env(safe-area-inset-right,0px)) 6px calc(8px + env(safe-area-inset-left,0px))}
.app[data-layout="land"] .topbar{display:contents}
.app[data-layout="land"] #menuBtn{grid-area:lt;justify-self:start}
.app[data-layout="land"] #pauseBtn{grid-area:rt;justify-self:end}
.app[data-layout="land"] .hud{grid-area:lm;justify-self:start}
.app[data-layout="land"] .tbrand{grid-area:rm;justify-self:end;font-size:.95rem;opacity:.55}
.app[data-layout="land"] .board-wrap{grid-area:board;align-self:center}
.app[data-layout="land"] .ctl{display:contents}
.app[data-layout="land"] .joyzone{grid-area:joy;align-self:stretch;height:100%}
.app[data-layout="land"] .btns{grid-area:btn;align-self:stretch;height:100%}
.app[data-layout="land"] .ctl.swap .joyzone{grid-area:btn}
.app[data-layout="land"] .ctl.swap .btns{grid-area:joy}
.app[data-layout="land"] .joyhint{display:none}
:root[data-ui="touch"] .app[data-layout="port"]{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.app[data-layout="port"] .topbar{width:100%;justify-content:space-between}
.app[data-layout="port"] .hud{flex:1;justify-content:center;flex-wrap:nowrap;gap:4px;min-width:0}
.app[data-layout="port"] .hud > div{padding:4px 8px 4px 6px}
.app[data-layout="port"] .tbrand{display:none}
.app[data-layout="port"] .ctl{flex:1;width:100%;min-height:0}
:root[data-ui="touch"] .side{display:none}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-inner{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sheet-inner .side,:root[data-ui="touch"] .sheet-inner .side{display:flex}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.closeBtn{font-weight:700;padding:8px 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
@media (prefers-reduced-motion:reduce){ .hud dd.pulse{animation:none} }
</style>
</head>
<body>
<main class="app" id="app">
  <h1 class="sr">Vaultrunner Remix</h1>
  <div class="topbar">
    <button class="ib" id="menuBtn" aria-label="Menu: levels, looks and settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand dbrand" aria-hidden="true">Vault<span>runner</span> Remix</div>
    <dl class="hud">
      <div class="h-lvl"><button class="lvb" id="lvDown2" aria-label="Previous level" title="Previous level ( [ )">−</button><dt>LV</dt><dd id="lvl">1</dd><button class="lvb" id="lvUp2" aria-label="Next level" title="Next level ( ] )">+</button></div>
      <div class="h-lives"><dt><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg><span class="sr">Lives</span></dt><dd id="lives">5</dd></div>
      <div class="h-gold"><dt><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 19l2.5-6h13L21 19z" opacity=".75"/><path d="M7 12l2-5h6l2 5z"/></svg><span class="sr">Gold left</span></dt><dd id="goldLeft">0</dd></div>

function reveal(){
  revealed = true;

  banner = { text:'Escape ladder open!', t:2 };
}
function update(dt){
  clock += dt;
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (digFail && (digFail.t -= dt) <= 0) digFail = null;
  if (dying){ dying -= dt; if (dying <= 0) loseLife(); return; }
  updateHoles(dt);
  if (dying) return;
  levelClock += dt;
  if (curSpecial === 'timer'){ timeLeft -= dt; if (timeLeft <= 0){ timeLeft = 0; banner = { text:'Out of time!', t:1.4 }; killPlayer(); return; } }
  if (player.dig > 0) player.dig -= dt;
  if (digLock > 0) digLock -= dt;
  const want = digLock > 0 ? null : (dirStack.length ? dirStack[dirStack.length - 1] : null);
  moveActor(player, want, PSPEED, dt);
  conveyor(player, dt);
  if (freezeT > 0) freezeT -= dt;
  if (smokeT > 0){ smokeT -= dt; if (!reduceMotion && Math.random() < 0.3) parts.push({ x:player.x + 0.5 + (Math.random() - 0.5) * 1.6, y:player.y + 0.2 + (Math.random() - 0.5), vx:(Math.random() - 0.5) * 0.6, vy:-0.4, t:1, color:'rgba(200,200,210,.7)', g:0 }); }
  if (decoy && (decoy.t -= dt) <= 0) decoy = null;
  springAnim.forEach((v, k) => { if ((v -= dt) <= 0) springAnim.delete(k); else springAnim.set(k, v); });
  const pc = Math.round(player.x), pr = Math.round(player.y), pk = key(pc, pr);
  playerInteract(pc, pr, pk, dt, want);
  if (gold.has(pk) && Math.abs(player.x - pc) < 0.4 && Math.abs(player.y - pr) < 0.4){
    gold.delete(pk); score += 250;
    burst(pc + 0.5, pr + 0.6, '#F2C94C', 12, 2.6); popText(pc + 0.5, pr, '+250');
    if (gold.size === 0 && !guards.some(g => g.carry)) popText(pc + 0.5, pr - 0.6, 'Last one!', '#FFFFFF');
  }
  if (!revealed && gold.size === 0 && !guards.some(g => g.carry)) reveal();
  else if (!revealed && gold.size === 0 && !toldCarry){ toldCarry = true; banner = { text:'A guard has the last gold!', t:2.6 }; }
  if (revealed && player.y <= 0.001 && !player.falling){ levelClear(); return; }
  const spd = GSPEED * (1 + Math.min(0.2, Math.max(0, levelIdx - 11) * 0.01)) * (curSpecial === 'rush' ? 1.2 : 1);
  guards.forEach(g => updateGuard(g, dt, spd));

  [player, ...guards].forEach(a => {
    if (a.dead) return;
    const tc = Math.round(a.x), tr = Math.round(a.y), tk = key(tc, tr);
    if (tile(tc, tr) === FALSE && !trapsSeen.has(tk)){
      trapsSeen.add(tk);
      burst(tc + 0.5, tr + 0.5, '#C9784A', 10, 2.2);
      if (!trapTold && a === player){ trapTold = true; banner = { text:'Trap brick!', t:1.6 }; }
    }

  // safety net: nobody may ever stand inside brick or stone
  for (const g of guards){
    if (g.dead || g.climb || g.trapped > 0) continue;
    const gc = Math.round(g.x), gr = Math.round(g.y);
    if (isSolid(gc, gr) && !holes.has(key(gc, gr))){
      if (gr > 0 && !isSolid(gc, gr - 1)){ g.y = gr - 1; g.x = gc; g.falling = false; g.dir = null; }
      else { g.dead = 1.6; if (typeof onGuardCrushed === 'function') onGuardCrushed(g); }
    }
  }
  { const pc2 = Math.round(player.x), pr2 = Math.round(player.y);
    if (!dying && isSolid(pc2, pr2) && !holes.has(key(pc2, pr2))){
      let ur = pr2 - 1; while (ur > 0 && isSolid(pc2, ur)) ur--;

      burst(pc2 + 0.5, player.y + 0.9, '#FFFFFF', 6, 1.5);
    }
  }
  for (const g of guards){
    if (g.dead || g.wait > 0 || freezeT > 0) continue;
    if (Math.abs(g.x - player.x) < 0.68 && Math.abs(g.y - player.y) < 0.68){ wakeGuard(g); killPlayer(); return; }
  }
}
function playerInteract(pc, pr, pk, dt, want){
  const aligned = Math.abs(player.x - pc) < 0.4 && Math.abs(player.y - pr) < 0.4;
  const standing = !player.falling && (player.launch === null || player.launch === undefined) && Math.abs(player.y - pr) < 0.001;
  // springs
  if (player.springCd > 0) player.springCd -= dt;
  if (standing && tile(pc, pr) === SPRING && Math.abs(player.x - pc) < 0.2 && !(player.springCd > 0)) launch(player, pc, pr);
  // crumbling bricks under your feet
  if (standing && tile(pc, pr) !== LADDER && tile(pc, pr + 1) === CRUMBLE){
    const k = key(pc, pr + 1), t = (crumbleT.get(k) || 0) + dt;

      banner = { text:`${it === 'keyR' ? 'Red' : 'Blue'} doors open!`, t:1.6 };
      burst(pc + 0.5, pr + 0.5, '#FFE680', 10, 2);
    } else {
      inv[it]++; burst(pc + 0.5, pr + 0.5, '#9FD8FF', 10, 2);
      popText(pc + 0.5, pr, ITEM_INFO[it].name, '#9FD8FF');
    }
    renderInv();

  // levers
  if (Math.abs(player.y - pr) < 0.4 && tile(pc, pr) === LEVER && want === 'up'){ if (player.lastLever !== pk){ player.lastLever = pk; player.x = pc; toggleGates(); } }

      }
    }

}
function toggleGates(){

    if (grid[r][c] === GATE){ grid[r][c] = GATE_OPEN; burst(c + 0.5, r + 0.5, '#9AA7B5', 4, 1.2); }
    else if (grid[r][c] === GATE_OPEN){
      grid[r][c] = GATE; burst(c + 0.5, r + 0.5, '#9AA7B5', 6, 1.6);
      guards.forEach(g => { if (!g.dead && Math.abs(g.x - c) < 0.6 && Math.abs(g.y - r) < 0.7){ g.dead = 1.6; score += 75; onGuardCrushed(g); if (g.carry){ g.carry = false; if (r > 0 && !isSolid(c, r - 1)) gold.add(key(c, r - 1)); } } });
      if (Math.abs(player.x - c) < 0.6 && Math.abs(player.y - r) < 0.7) killPlayer();

const ITEM_INFO = {
  freeze:{ name:'Freeze clock', key:'1', text:'Stops every guard for 5 seconds. Frozen guards can’t hurt you.' },
  smoke:{ name:'Smoke bomb', key:'2', text:'Guards lose track of you for 5 seconds and wander about.' },
  decoy:{ name:'Decoy coin', key:'3', text:'Drop it where you stand. Guards chase it instead of you for 7 seconds.' },

function useItem(it){

    if (tile(pc, pr) !== EMPTY){ banner = { text:'No room for a ladder here', t:1.2 }; return; }

function updateFx(dt){

  if (flash > 0) flash = Math.max(0, flash - dt);

/* ---------- Overlay, HUD ---------- */
function showOverlay(t, p, b, b2){
  $('ovTitle').textContent = t; $('ovText').innerHTML = p; $('ovBtn').textContent = b;
  $('ovBtn2').hidden = !b2; if (b2) $('ovBtn2').textContent = b2;
  $('overlay').hidden = false;
}
function togglePause(){
  if (state === 'play'){ state = 'pause'; dirStack = []; showOverlay('Paused', 'Take a breath. Your vault is waiting.', 'Resume'); }
  else if (state === 'pause'){ state = 'play'; $('overlay').hidden = true; }
}
$('ovBtn').addEventListener('click', () => {
  if (state === 'pause') togglePause();
  else if (state === 'ready'){ state = 'play'; $('overlay').hidden = true; }
  else if (state === 'idle' || state === 'over') newGame(startFrom);
});
$('ovBtn2').addEventListener('click', () => { startFrom = 0; newGame(0); });
function restartLevel(){
  if (state !== 'play' && state !== 'pause') return;
  $('overlay').hidden = true; state = 'play';
  killPlayer();
}
function setLevelTo(n){
  n = Math.max(1, Math.min(999, n));
  if (dying || n === levelIdx + 1 && state !== 'over' && state !== 'idle') return;
  dirStack = [];
  const L = getLevel(n - 1);
  if (state === 'idle' || state === 'over'){
    startFrom = n - 1; levelIdx = n - 1; loadLevel(levelIdx); state = 'idle';
    showOverlay(`Level ${n}`, `<b>${L.name}</b>.${n > unlocked ? ' You haven’t reached this one yet, so a run started here won’t count toward your best score.' : ''}`, `Start level ${n}`, n > 1 ? 'Start from level 1' : null);
    renderLooks(); renderGuide(); renderLevels();
  } else {
    if (n > unlocked) runSkipped = true;
    levelIdx = n - 1; startLevel();
    if (runSkipped && n > unlocked) $('ovText').innerHTML += ' <br>Runs that skip ahead don’t count toward your best score.';
  }

}
$('lvDown').addEventListener('click', () => { setLevelTo(levelIdx); $('lvDown').blur(); });
['routeTop', 'routeBtn'].forEach(id => $(id).addEventListener('click', () => { toggleRoute(); $(id).blur(); }));
$('lvDown2').addEventListener('click', () => { setLevelTo(levelIdx); $('lvDown2').blur(); });
$('lvUp2').addEventListener('click', () => { setLevelTo(levelIdx + 2); $('lvUp2').blur(); });

function updateHUD(){
  $('lvShow').textContent = `Level ${levelIdx + 1}`;

  $('lvUp2').disabled = dying > 0;
  $('lvl').textContent = levelIdx + 1;

/* ---------- Drawing ---------- */
function vars(){ return lookNow(); }

(function joystick(){
  const zone = $('joyZone'), base = $('joyBase'), knob = $('joyKnob'), arrows = base.querySelectorAll('.joyarrows i');

  const setDir = d => {

    if (cur) release(cur);
    cur = d;
    if (d && state === 'play') press(d);
    arrows.forEach(a => a.classList.toggle('hot', !!d && a.classList.contains({ up:'u', down:'d', left:'l', right:'r' }[d])));
  };
  const place = (x, y) => { base.style.left = x + 'px'; base.style.top = y + 'px'; };
  const rest = () => { base.style.left = '50%'; base.style.top = '50%'; knob.style.transform = ''; base.classList.remove('on'); };
  zone.addEventListener('pointerdown', e => {
    if (id !== null) return;
    e.preventDefault(); id = e.pointerId; zone.setPointerCapture?.(id);
    const r = zone.getBoundingClientRect();
    cx = Math.max(r.left + 40, Math.min(r.right - 40, e.clientX)); cy = Math.max(r.top + 40, Math.min(r.bottom - 40, e.clientY));
    place(cx - r.left, cy - r.top); base.classList.add('on'); $('joyHint').style.opacity = '0';
    move(e);
  });
  function move(e){
    if (e.pointerId !== id) return;

    if (d > R * 1.5){ const k = (d - R * 1.5) / d; cx += dx * k; cy += dy * k; const r = zone.getBoundingClientRect(); place(cx - r.left, cy - r.top); dx = e.clientX - cx; dy = e.clientY - cy; d = Math.hypot(dx, dy); }
    const kk = Math.min(1, R / Math.max(1, d));
    knob.style.transform = `translate(${dx * kk}px, ${dy * kk}px)`;
    if (d < DEAD){ setDir(null); return; }
    const ax = Math.abs(dx), ay = Math.abs(dy);
    let nd = ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (cur && nd !== cur){
      const curH = cur === 'left' || cur === 'right';
      const along = curH ? ax : ay, across = curH ? ay : ax;
      const same = curH ? Math.sign(dx) === (cur === 'right' ? 1 : -1) : Math.sign(dy) === (cur === 'down' ? 1 : -1);

})();

$('closeSheet').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
$('pauseBtn').addEventListener('click', () => { togglePause(); $('pauseBtn').blur(); });
function showSwitches(){
  $('endless').setAttribute('aria-checked', String(endless));
  $('swapSides').setAttribute('aria-checked', String(swap));
  $('ctl').classList.toggle('swap', swap);
  updateHUD();
}
$('endless').addEventListener('click', () => {
  endless = !endless; if (endless && state !== 'idle') runEndless = true; if (!endless && lives <= 0) lives = 1;
  store('endless', endless ? '1' : '0'); showSwitches();
});
$('swapSides').addEventListener('click', () => { swap = !swap; store('swap', swap ? '1' : '0'); showSwitches(); });
$('touchMode').addEventListener('click', () => { touchPref = touchUI() ? '0' : '1'; store('touch', touchPref); applyUI(); });
$('restartBtn').addEventListener('click', () => { closeSheet(); if (state === 'pause') togglePause(); restartLevel(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.ctl')) e.preventDefault(); });

/* keyboard */
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
function press(dir){ dirStack = dirStack.filter(d => d !== dir); dirStack.push(dir); }
function release(dir){ dirStack = dirStack.filter(d => d !== dir); }
document.addEventListener('keydown', e => {
  if (e.target.closest?.('select,input')) return;
  if (KEYMAP[e.key]){ e.preventDefault(); if (state === 'play') press(KEYMAP[e.key]); return; }
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'q'){ e.preventDefault(); dig(-1); return; }
  if (k === 'x' || k === 'e'){ e.preventDefault(); dig(1); return; }
  if (k === 'r'){ restartLevel(); return; }
  if (k === 'h' && !e.repeat){ toggleRoute(); return; }
  if (/^[1-4]$/.test(e.key) && !e.repeat){ useItem(Object.keys(ITEM_INFO)[+e.key - 1]); return; }
  if (k === 't' && !e.repeat){ touchPref = touchUI() ? '0' : '1'; store('touch', touchPref); applyUI(); return; }
  if (e.key === '['){ setLevelTo(levelIdx); return; }
  if (e.key === ']'){ setLevelTo(levelIdx + 2); return; }
  if (k === 'p' || e.key === 'Escape'){ if (!$('sheet').hidden) closeSheet(); else togglePause(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !$('overlay').hidden && document.activeElement !== $('ovBtn') && document.activeElement !== $('ovBtn2')){ e.preventDefault(); $('ovBtn').click(); }
});
document.addEventListener('keyup', e => { if (KEYMAP[e.key]) release(KEYMAP[e.key]); });
window.addEventListener('blur', () => { dirStack = []; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

/* loop */
let tick = 0;
function loop(t){
  const dt = Math.min(0.04, (t - lastT) / 1000); lastT = t;
  if (state === 'play') update(dt); else clock += dt;
  updateFx(dt);
  draw();
  if (++tick % 6 === 0) updateHUD();
  requestAnimationFrame(loop);
}

/* start */
showSwitches();
applyUI();
loadLevel(0);
renderLevels();
showOverlay('Vaultrunner', 'Grab every gold bar, then climb the glowing escape ladder to the top of the screen. You can’t fight the guards, but you can dig holes in the brick floor to trap them. Holes fill back in after a few seconds.', unlocked > 1 ? 'Play level 1' : 'Play', null);
updateHUD();
setTimeout(() => { layout(); app.classList.add('ready'); }, 600);
requestAnimationFrame(t => { lastT = t; loop(t); });
})();
</script>
</body>
