<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" id="tc" content="#3a6ea5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сяке-Маки тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#3a6ea5; --face:#d4d0c8; --hi:#ffffff; --lite:#e8e6e0; --shade:#808080; --dark:#404040;
  --text:#000000; --field:#ffffff; --fieldtext:#000000; --muted:#555555;
  --t1:#0a246a; --t2:#a6caf0; --tt:#ffffff; --sel:#0a246a; --seltext:#ffffff;
  --ok:#1d7a2a; --okbg:#d9f2d6; --bad:#b3261e; --badbg:#fbdcd8;
  --paper:#fffdf2; --rule:#b9d3ee; --margin:#e7908e; --ink:#1b2a6b;
  --b0:#c8c4bc; --b1:#e2574c; --b2:#f0a030; --b3:#e6d03a; --b4:#7cc35a; --b5:#2f8f3a;
  --ui:Tahoma, Verdana, "Segoe UI", Geneva, sans-serif;
  --hand:"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#14283f; --face:#3b3a37; --hi:#6a6862; --lite:#4a4945; --shade:#232220; --dark:#121211;
    --text:#ecebe6; --field:#262523; --fieldtext:#f0efea; --muted:#b5b3ac;
    --t1:#1c3a7a; --t2:#3f6aa8; --sel:#3d63b0;
    --ok:#7fd88a; --okbg:#1f3a22; --bad:#ff8f84; --badbg:#46201d;
    --paper:#ece6d2; --rule:#a9c2db; --margin:#d98a88; --ink:#1b2a6b; --b0:#5a5853;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#14283f; --face:#3b3a37; --hi:#6a6862; --lite:#4a4945; --shade:#232220; --dark:#121211;
  --text:#ecebe6; --field:#262523; --fieldtext:#f0efea; --muted:#b5b3ac;
  --t1:#1c3a7a; --t2:#3f6aa8; --sel:#3d63b0;
  --ok:#7fd88a; --okbg:#1f3a22; --bad:#ff8f84; --badbg:#46201d;
  --paper:#ece6d2; --rule:#a9c2db; --margin:#d98a88; --ink:#1b2a6b; --b0:#5a5853;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--text);font:13px/1.4 var(--ui);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button,input,select{font:inherit;color:inherit}
.raised{background:var(--face);box-shadow:inset -1px -1px var(--dark),inset 1px 1px var(--hi),inset -2px -2px var(--shade),inset 2px 2px var(--lite)}
.sunken{background:var(--field);color:var(--fieldtext);box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi),inset 2px 2px var(--dark),inset -2px -2px var(--lite)}
.wrap{height:100%;padding:18px;display:flex;justify-content:center}
.win{width:100%;max-width:1120px;height:100%;display:flex;flex-direction:column;padding:3px}
.titlebar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--tt);font-weight:bold;user-select:none}
.titlebar .ico{width:16px;height:16px;display:grid;place-items:center;background:#f7d64a;color:#0a246a;font-size:11px;border:1px solid #7a5d00;line-height:1}
.titlebar .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:18px;height:16px;padding:0;border:0;font-size:10px;line-height:1;color:var(--text);cursor:pointer}
.toolbar{display:flex;gap:2px;padding:4px;align-items:stretch;overflow-x:auto;border-bottom:1px solid var(--shade)}
.tool{min-width:66px;border:0;background:transparent;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--text)}
.tool .g{font-size:20px;line-height:22px}
.tool:hover{box-shadow:inset -1px -1px var(--shade),inset 1px 1px var(--hi)}
.tool[aria-pressed="true"]{box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi);background:var(--lite)}
.sep{width:2px;margin:2px 6px;box-shadow:inset 1px 0 var(--shade),inset -1px 0 var(--hi);flex:0 0 2px}
.opts{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 4px;white-space:nowrap}
.opts label{display:flex;align-items:center;gap:6px;justify-content:space-between}
select{background:var(--field);color:var(--fieldtext);border:0;padding:2px 4px;box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi),inset 2px 2px var(--dark)}
.main{flex:1;display:flex;gap:4px;padding:4px;min-height:0}
.pane-left{width:250px;flex:0 0 250px;display:flex;flex-direction:column;min-height:0}
.coursepick{display:flex;flex-direction:column;gap:3px;margin:0 0 8px 2px;font-weight:bold;font-size:12px}
.coursepick select{font-weight:normal;width:100%}
.pane-left h2,.groupt{font-size:12px;font-weight:bold;margin:0 0 3px 2px}
.tree{flex:1;overflow:auto;padding:4px 2px}
.tree ul{list-style:none;margin:0;padding:0}
.tree li ul{padding-left:18px}
.node{display:flex;align-items:center;gap:4px;padding:1px 2px;white-space:nowrap}
.node label{display:flex;align-items:center;gap:4px;cursor:pointer;flex:1;min-width:0}
.node .lbl{overflow:hidden;text-overflow:ellipsis}
.node .cnt{color:var(--muted);font-size:11px}
.exp{width:11px;height:11px;border:1px solid var(--shade);background:var(--field);color:var(--fieldtext);font-size:10px;line-height:8px;padding:0;cursor:pointer;flex:0 0 11px}
.treebtns{display:flex;gap:4px;margin-top:4px}
.btn{border:0;padding:4px 12px;min-height:25px;cursor:pointer;color:var(--text)}
.btn:active:not(:disabled){box-shadow:inset 1px 1px var(--dark),inset -1px -1px var(--hi),inset 2px 2px var(--shade)}
.btn:disabled{color:var(--shade);cursor:default}
.btn.default{outline:1px solid var(--dark)}
:focus-visible{outline:1px dotted var(--text);outline-offset:-4px}
.btn.default:focus-visible{outline:1px dotted var(--text)}
.pane-right{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow:auto;padding:14px}
.status{display:flex;gap:2px;padding:2px}
.status span{padding:1px 6px;box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status span:first-child{flex:1}

/* browse */
.searchrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.searchrow input{flex:1;min-width:160px;border:0;padding:4px 6px;background:var(--field);color:var(--fieldtext);box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi),inset 2px 2px var(--dark)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--field);color:var(--fieldtext)}
th{background:var(--face);color:var(--text);text-align:left;font-weight:normal;padding:3px 6px;box-shadow:inset -1px -1px var(--shade),inset 1px 1px var(--hi);position:sticky;top:-14px}
td{padding:3px 6px;border-bottom:1px solid var(--lite);vertical-align:top}
tr.unit td{background:var(--lite);color:var(--text);font-weight:bold}
.boxes{display:inline-flex;gap:2px;vertical-align:middle}
.boxes i{width:8px;height:8px;border:1px solid var(--shade);background:var(--field)}
.card .boxes i{background:transparent;border-color:#9a9a9a}
.card .boxes i.on{background:#4f9a3e;border-color:#2f6d24}
.boxes i.on{background:var(--b4);border-color:var(--ok)}
.spk{border:0;background:none;cursor:pointer;padding:0 4px;font-size:14px;color:inherit}

/* card */
.stage{max-width:620px;margin:0 auto}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar{flex:1;height:18px;padding:2px}
.bar b{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sel) 0 9px,transparent 9px 11px);transition:width .25s}
.card{position:relative;background:var(--paper);color:var(--ink);min-height:250px;padding:34px 24px 22px 64px;
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
  repeating-linear-gradient(var(--paper) 0 33px,var(--rule) 33px 34px);
  box-shadow:2px 3px 0 var(--shade);border:1px solid var(--shade)}
.card .where{position:absolute;top:8px;left:64px;right:12px;font:11px var(--ui);color:#6b6b6b;display:flex;justify-content:space-between}
.card .q{font:40px/1.1 var(--hand);margin:18px 0 6px;word-break:break-word}
.card .a{font:32px/1.1 var(--hand);color:#b3261e;margin-top:14px;min-height:36px;word-break:break-word}
.card .a.hidden{color:transparent;text-shadow:none}
.card .langtag{font:11px var(--ui);color:#6b6b6b}
.card .spk{position:absolute;right:10px;bottom:10px;font-size:18px;color:#1b2a6b}
.flipin{animation:flip .28s ease-out}
@keyframes flip{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.flipin{animation:none}.bar b{transition:none}}
.actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.actions .btn{min-width:130px}
.kbd{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.choice{border:0;text-align:left;padding:10px 12px;cursor:pointer;color:var(--text);display:flex;gap:8px;align-items:baseline}
.choice .n{font-size:11px;color:var(--muted)}
.choice.right{background:var(--okbg);color:var(--ok);font-weight:bold}
.choice.wrong{background:var(--badbg);color:var(--bad)}
.answer{display:flex;gap:8px;margin-top:14px}
.answer input{flex:1;font-size:18px;padding:6px 8px;border:0;background:var(--field);color:var(--fieldtext);box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--hi),inset 2px 2px var(--dark);min-width:0}
.feedback{margin-top:10px;padding:8px 10px;min-height:38px}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.dialog{max-width:460px;margin:30px auto;padding:3px}
.dialog .titlebar{margin-bottom:0}
.dialog .body{padding:16px}
.dialog .body p{margin:0 0 10px}
.big{font-size:28px;font-weight:bold}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.statgrid div{padding:8px 10px}
.statgrid b{display:block;font-size:22px}
.urow{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin:6px 0}
.stack{display:flex;height:18px;padding:2px}
.stack span{height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin:8px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border:1px solid var(--shade)}
.hint{color:var(--muted)}
.empty{text-align:center;padding:40px 10px}
.mobilecol{display:none}

@media (max-width:760px){
  .wrap{padding:0}
  .win{max-width:none}
  .main{flex-direction:column}
  .pane-left{width:auto;flex:0 0 auto}
  .pane-left .tree{max-height:34vh}
  .pane-left.closed .tree,.pane-left.closed .treebtns{display:none}
  .mobilecol{display:inline-block}
  .choices{grid-template-columns:1fr}
  .card{padding:30px 14px 18px 56px}
  .card .where{left:56px}
  .card .q{font-size:32px}
  .tbtn{display:none}
  .toolbar{flex-wrap:wrap}
  .toolbar .sep{display:none}
  .opts{flex-direction:row;flex-wrap:wrap;gap:6px 12px;padding:4px}
  .view{padding:10px}
  .urow{grid-template-columns:100px 1fr 40px}
  .status span:nth-child(3){display:none}
}
</style>
<style>@media (max-width:760px){.deskonly{display:none}}
/* ===== Modern theme ===== */
.uitoggle{height:16px;padding:0 8px;border:0;font:11px var(--ui);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.uitoggle .sw{display:none}
:root[data-ui="modern"]{
  --m-bg:#ECEEF3; --m-surface:#FFFFFF; --m-sunk:#F3F4F8; --m-line:#DDE1EA; --m-ink:#16213E; --m-muted:#5B6478;
  --m-pri:#2F5BEA; --m-prink:#FFFFFF; --m-hl:#FFE45C; --m-hlink:#16213E;
  --m-ok:#12805C; --m-okbg:#E2F4EB; --m-bad:#C2412D; --m-badbg:#FBE8E4;
  --m-shadow:0 1px 2px rgba(22,33,62,.06),0 22px 44px -26px rgba(22,33,62,.32);
  --ui:"Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --disp:"Bricolage Grotesque", "Onest", "Segoe UI", system-ui, sans-serif;
  --b0:#DDE1EA; --b1:#F08A7A; --b2:#F5B556; --b3:#F2DA4E; --b4:#73C79B; --b5:#12805C;
}
@media (prefers-color-scheme: dark){
  :root[data-ui="modern"]:not([data-theme="light"]){
    --m-bg:#0D121D; --m-surface:#151C2B; --m-sunk:#1B2334; --m-line:#29334A; --m-ink:#E8ECF5; --m-muted:#9AA4BA;
    --m-pri:#86A2FF; --m-prink:#0D121D; --m-ok:#5FD3A2; --m-okbg:#12322A; --m-bad:#FF8C76; --m-badbg:#3A1E1A;
    --m-shadow:0 1px 2px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.7); --b0:#29334A;
  }
}
:root[data-ui="modern"][data-theme="dark"]{

  --m-pri:#86A2FF; --m-prink:#0D121D; --m-ok:#5FD3A2; --m-okbg:#12322A; --m-bad:#FF8C76; --m-badbg:#3A1E1A;
  --m-shadow:0 1px 2px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.7); --b0:#29334A;
}
:root[data-ui="modern"] body{background:var(--m-bg);color:var(--m-ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}

/* header */
:root[data-ui="modern"] .titlebar{background:none;color:var(--m-ink);padding:2px 2px 0;gap:10px;font-weight:600}
:root[data-ui="modern"] .titlebar .ico{width:32px;height:32px;border:0;border-radius:9px;background:var(--m-hl);color:var(--m-hlink);font:800 13px var(--disp);letter-spacing:-.02em}
:root[data-ui="modern"] .titlebar .name{font:650 19px/1.2 var(--disp);letter-spacing:-.015em}
:root[data-ui="modern"] .tbtn{display:none}
:root[data-ui="modern"] .uitoggle{height:auto;padding:7px 12px 7px 8px;border:1px solid var(--m-line);border-radius:999px;background:var(--m-surface);color:var(--m-ink);font:500 13px var(--ui);gap:8px}
:root[data-ui="modern"] .uitoggle .sw{display:inline-block;position:relative;width:30px;height:18px;border-radius:999px;background:var(--m-pri)}
:root[data-ui="modern"] .uitoggle .sw::after{content:"";position:absolute;top:2px;left:14px;width:14px;height:14px;border-radius:50%;background:var(--m-prink)}
/* toolbar */
:root[data-ui="modern"] .toolbar{background:var(--m-surface);border:1px solid var(--m-line);border-radius:16px;padding:6px;gap:4px;align-items:center;flex-wrap:wrap;overflow:visible;row-gap:6px}
:root[data-ui="modern"] .urow{grid-template-columns:200px 1fr 48px}
:root[data-ui="modern"] .tool{flex-direction:row;min-width:0;flex-shrink:0;padding:9px 14px;border-radius:11px;color:var(--m-muted);font-weight:550;gap:6px;white-space:nowrap}
:root[data-ui="modern"] .tool .g{display:none}
:root[data-ui="modern"] .tool:hover{box-shadow:none;background:var(--m-sunk);color:var(--m-ink)}
:root[data-ui="modern"] .tool[aria-pressed="true"]{box-shadow:none;background:var(--m-hl);color:var(--m-hlink);font-weight:650}
:root[data-ui="modern"] .sep{width:1px;flex:0 0 1px;height:26px;align-self:center;box-shadow:none;background:var(--m-line);margin:0 8px}
:root[data-ui="modern"] .opts{flex-direction:row;align-items:center;gap:14px;color:var(--m-muted);font-size:13px}
:root[data-ui="modern"] select{background:var(--m-sunk);color:var(--m-ink);border:1px solid var(--m-line);border-radius:9px;padding:6px 8px;box-shadow:none;font-size:13px}
:root[data-ui="modern"] input[type="checkbox"]{accent-color:var(--m-pri);width:16px;height:16px}
/* panes */
:root[data-ui="modern"] .main{padding:0;gap:12px}
:root[data-ui="modern"] .pane-left{background:var(--m-surface);border:1px solid var(--m-line);border-radius:20px;padding:16px 12px 12px;width:268px;flex-basis:268px}
:root[data-ui="modern"] .coursepick,:root[data-ui="modern"] .pane-left h2,:root[data-ui="modern"] .groupt{font:600 13px var(--ui);color:var(--m-muted);margin-left:4px}
:root[data-ui="modern"] .coursepick select{font-weight:550;padding:9px 10px}
:root[data-ui="modern"] .groupt{color:var(--m-ink);font:650 16px var(--disp);margin:18px 0 8px}
:root[data-ui="modern"] .tree{background:transparent;padding:0}
:root[data-ui="modern"] .node{padding:6px;border-radius:9px;gap:6px}
:root[data-ui="modern"] .node:hover{background:var(--m-sunk)}
:root[data-ui="modern"] .exp{border:0;background:transparent;color:var(--m-muted);width:18px;height:18px;flex-basis:18px;font-size:14px;line-height:18px;border-radius:5px}
:root[data-ui="modern"] .exp:hover{background:var(--m-line)}
:root[data-ui="modern"] .node .cnt{color:var(--m-muted);font-size:12px;margin-left:auto}
:root[data-ui="modern"] .view{background:var(--m-surface);border:1px solid var(--m-line);border-radius:20px;padding:28px}
:root[data-ui="modern"] .status{padding:0 4px;gap:16px}
:root[data-ui="modern"] .status span{box-shadow:none;padding:0;color:var(--m-muted);font-size:12px}
/* buttons */
:root[data-ui="modern"] .btn{background:var(--m-sunk);color:var(--m-ink);border:1px solid var(--m-line);border-radius:12px;padding:9px 18px;min-height:42px;font-weight:600;box-shadow:none;outline:0;transition:background .15s,border-color .15s}
:root[data-ui="modern"] .btn:hover:not(:disabled){border-color:var(--m-muted)}
:root[data-ui="modern"] .btn:active:not(:disabled){box-shadow:none;transform:translateY(1px)}
:root[data-ui="modern"] .btn.default{background:var(--m-pri);color:var(--m-prink);border-color:var(--m-pri)}
:root[data-ui="modern"] .btn:disabled{opacity:.45;color:var(--m-ink)}
:root[data-ui="modern"] .treebtns .btn{flex:1;min-height:36px;padding:6px 10px;font-size:13px}
:root[data-ui="modern"] #no{background:var(--m-badbg);color:var(--m-bad);border-color:transparent}
/* list */
:root[data-ui="modern"] .searchrow input{background:var(--m-sunk);color:var(--m-ink);border:1px solid var(--m-line);border-radius:12px;padding:11px 14px;box-shadow:none;font-size:15px}
:root[data-ui="modern"] .hint{color:var(--m-muted)}
:root[data-ui="modern"] table{background:transparent;color:var(--m-ink)}
:root[data-ui="modern"] th{background:var(--m-surface);color:var(--m-muted);box-shadow:inset 0 -1px var(--m-line);font-weight:600;font-size:12px;padding:10px 8px;top:-28px}
:root[data-ui="modern"] td{border-bottom:1px solid var(--m-line);padding:10px 8px}
:root[data-ui="modern"] tr.unit td{background:transparent;color:var(--m-ink);font:650 16px var(--disp);padding-top:22px}
:root[data-ui="modern"] .boxes{gap:3px}
:root[data-ui="modern"] .boxes i,:root[data-ui="modern"] .card .boxes i{width:12px;height:5px;border:0;border-radius:3px;background:var(--m-line)}
:root[data-ui="modern"] .boxes i.on,:root[data-ui="modern"] .card .boxes i.on{background:var(--m-ok)}

  gleb: { name: 'G’s collection: Family & relationships', title: 'G’s collection', target: 'en', unit: 'Part', prefix: 'gleb:', data: [{"n":1,"t":"Family","s":[{"t":"Family","w":[["In two thirds of Austrian households is at least one child.","In zwei Dritteln der österreichischen Haushalte gibt es mindestens ein Kind.","В двух третях австрийских семей есть хотя бы один ребёнок."],["I don’t have any brothers and sisters; I’m an only child.","Ich habe keine Geschwister; ich bin ein Einzelkind.","У меня нет братьев и сестёр; я единственный ребёнок."],["I don’t have any siblings, but I have a lot of cousins.","Ich habe keine Geschwister, aber ich habe viele Cousins und Cousinen.","У меня нет братьев и сестёр, но у меня много двоюродных братьев и сестёр."],["The age gap between my parents is only 2 years.","Der Altersunterschied zwischen meinen Eltern beträgt nur zwei Jahre.","Разница в возрасте между моими родителями всего два года."],["Lucy moved out of her parental home and has her own apartment now.","Lucy ist aus ihrem Elternhaus ausgezogen und hat jetzt eine eigene Wohnung.","Люси уехала из родительского дома, и теперь у неё своя квартира."],["Children under 14 must be accompanied by an adult.","Kinder unter 14 Jahren müssen von einem Erwachsenen begleitet werden.","Дети до 14 лет должны быть в сопровождении взрослого."],["The number of single-parent families is growing fast.","Die Zahl der Alleinerziehendenfamilien steigt schnell.","Число неполных семей быстро растёт."],["They have agreed to get a divorce, because they don’t want to be married to each other anymore.","Sie haben sich auf eine Scheidung geeinigt, weil sie nicht mehr miteinander verheiratet sein wollen.","Они договорились развестись, потому что больше не хотят быть в браке друг с другом."],["They are considering separation as an option.","Sie ziehen eine Trennung als Möglichkeit in Betracht.","Они рассматривают расставание как вариант."],["Amy can’t go. In that case, I have to go for her.","Amy kann nicht gehen. In diesem Fall muss ich für sie gehen.","Эми не может пойти. В таком случае мне придётся пойти вместо неё."],["Blended families and stepfamilies with children from former marriages are becoming more common.","Patchwork- und Stieffamilien mit Kindern aus früheren Ehen werden immer häufiger.","Смешанные семьи и семьи с детьми от прежних браков встречаются всё чаще."],["Do you have any stepsiblings? I have two stepsisters.","Hast du Stiefgeschwister? Ich habe zwei Stiefschwestern.","У тебя есть сводные братья или сёстры? У меня две сводные сестры."],["Leon is my stepbrother. He’s my stepmother’s son.","Leon ist mein Stiefbruder. Er ist der Sohn meiner Stiefmutter.","Леон мой сводный брат. Он сын моей мачехи."],["Lisa is my stepsister. Her father married my mother.","Lisa ist meine Stiefschwester. Ihr Vater hat meine Mutter geheiratet.","Лиза моя сводная сестра. Её отец женился на моей маме."],["My mother has a daughter from her previous marriage. She’s my half-sibling.","Meine Mutter hat eine Tochter aus ihrer früheren Ehe. Sie ist meine Halbschwester.","У моей мамы есть дочь от предыдущего брака. Она моя единоутробная сестра."],["I don’t see my half-brother often. He lives with our dad.","Ich sehe meinen Halbbruder nicht oft. Er wohnt bei unserem Vater.","Я нечасто вижу своего единокровного брата. Он живёт с нашим папой."],["I started playing football at the age of 6.","Ich habe im Alter von sechs Jahren angefangen, Fußball zu spielen.","Я начал играть в футбол в шесть лет."],["Nadia and her husband want to start a family.","Nadia und ihr Mann wollen eine Familie gründen.","Надя и её муж хотят завести семью."]]}]},{"n":2,"t":"Housework & childcare","s":[{"t":"Housework & childcare","w":[["My mother does most of the chores.","Meine Mutter erledigt den Großteil der Hausarbeit.","Моя мама делает большую часть домашних дел."],["When my mom started working again, my grandmother looked after me.","Als meine Mutter wieder zu arbeiten anfing, passte meine Großmutter auf mich auf.","Когда мама снова начала работать, за мной присматривала бабушка."],["In my family everyone has to do a fair share of housework.","In meiner Familie muss jeder seinen gerechten Anteil an der Hausarbeit übernehmen.","В моей семье каждый должен делать свою часть домашней работы."],["My dad does the housework. He cooks and cleans.","Mein Vater erledigt die Hausarbeit. Er kocht und putzt.","Мой папа занимается домашним хозяйством. Он готовит и убирает."],["Who will do the childminding while you are at work?","Wer übernimmt die Kinderbetreuung, während du bei der Arbeit bist?","Кто будет присматривать за ребёнком, пока ты на работе?"],["My brother and I do the washing-up together every night.","Mein Bruder und ich spülen jeden Abend gemeinsam ab.","Мы с братом каждый вечер вместе моем посуду."],["My dad does most of the small repairs around the house.","Mein Vater erledigt die meisten kleinen Reparaturen im Haus.","Папа делает большую часть мелкого ремонта по дому."]]}]},{"n":3,"t":"Relationships & feelings","s":[{"t":"Relationships & feelings","w":[["She was a contented person with a hearty laugh.","Sie war ein zufriedener Mensch mit einem herzlichen Lachen.","Она была довольным жизнью человеком с сердечным смехом."],["We need social contact to feel secure.","Wir brauchen soziale Kontakte, um uns sicher zu fühlen.","Нам нужно общение, чтобы чувствовать себя в безопасности."],["Relationships cause powerful emotions.","Beziehungen lösen starke Gefühle aus.","Отношения вызывают сильные чувства."],["Dad didn’t come to my football game. He let me down again.","Papa ist nicht zu meinem Fußballspiel gekommen. Er hat mich wieder enttäuscht.","Папа не пришёл на мой футбольный матч. Он снова меня подвёл."],["There are growing tensions between the two countries.","Zwischen den beiden Ländern nehmen die Spannungen zu.","Напряжённость между двумя странами растёт."],["I’m going to a family party to see all my relatives.","Ich gehe zu einer Familienfeier, um alle meine Verwandten zu sehen.","Я иду на семейный праздник, чтобы увидеть всех своих родственников."],["She left home after falling out with her parents.","Sie verließ ihr Zuhause, nachdem sie sich mit ihren Eltern gestritten hatte.","Она ушла из дома после ссоры с родителями."],["There is no place for hatred in our society.","In unserer Gesellschaft ist kein Platz für Hass.","В нашем обществе нет места ненависти."],["They don’t keep any secrets from each other.","Sie haben keine Geheimnisse voreinander.","У них нет секретов друг от друга."],["You shouldn’t judge him before you get to know him.","Du solltest ihn nicht beurteilen, bevor du ihn kennenlernst.","Не стоит судить о нём, пока ты его не узнаешь."],["Being a good friend is quite a responsibility.","Ein guter Freund zu sein, ist eine große Verantwortung.","Быть хорошим другом — большая ответственность."],["Let’s not have an argument. Let’s agree to disagree.","Lass uns nicht streiten. Einigen wir uns darauf, unterschiedlicher Meinung zu sein.","Давай не будем спорить. Пусть каждый останется при своём мнении."],["Mia and I argue a lot but we always make up in the end.","Mia und ich streiten oft, aber am Ende versöhnen wir uns immer.","Мы с Мией часто спорим, но в конце всегда миримся."],["He’s had a lifelong interest in science.","Er interessiert sich schon sein ganzes Leben lang für Wissenschaft.","Он всю жизнь интересуется наукой."],["We’ve had a long friendship. We’ve been friends for years.","Uns verbindet eine lange Freundschaft. Wir sind seit Jahren befreundet.","Нас связывает долгая дружба. Мы дружим уже много лет."],["Teens join cliques to feel accepted and to have someone to go do activities with.","Jugendliche schließen sich Cliquen an, um sich akzeptiert zu fühlen und jemanden für gemeinsame Aktivitäten zu haben.","Подростки объединяются в компании, чтобы чувствовать себя принятыми и было с кем проводить время."],["There’s a special bond between a mother and her child.","Zwischen einer Mutter und ihrem Kind besteht eine besondere Bindung.","Между матерью и ребёнком существует особая связь."]]}]},{"n":4,"t":"Friends & society","s":[{"t":"Friends & society","w":[["My friend Allie and I have lots of things in common, e.g. we both like sports and play the trumpet.","Meine Freundin Allie und ich haben viel gemeinsam, z. B. mögen wir beide Sport und spielen Trompete.","У нас с моей подругой Элли много общего, например, мы обе любим спорт и играем на трубе."],["My parents and I have different attitudes to social media. I love it and use it every day, but they say it’s a waste of time.","Meine Eltern und ich haben unterschiedliche Einstellungen zu sozialen Medien. Ich liebe sie und nutze sie jeden Tag, aber sie finden, das ist Zeitverschwendung.","У нас с родителями разное отношение к соцсетям. Я их люблю и пользуюсь ими каждый день, а они считают, что это пустая трата времени."],["My friends are really nice. They’re good company too.","Meine Freunde sind wirklich nett. Mit ihnen kann man auch gut Zeit verbringen.","Мои друзья очень милые. С ними к тому же приятно проводить время."],["Our peers influence our opinions and behaviour.","Unsere Gleichaltrigen beeinflussen unsere Meinungen und unser Verhalten.","Сверстники влияют на наши мнения и поведение."],["Peer group pressure can be very powerful and difficult to resist.","Gruppendruck unter Gleichaltrigen kann sehr stark sein, und es ist schwer, ihm zu widerstehen.","Давление сверстников может быть очень сильным, и ему трудно противостоять."],["There are many people we have to get along with who are not necessarily friends.","Es gibt viele Menschen, mit denen wir auskommen müssen, die aber nicht unbedingt Freunde sind.","Есть много людей, с которыми нам приходится ладить, хотя они не обязательно наши друзья."],["My parents still treat me like a child.","Meine Eltern behandeln mich immer noch wie ein Kind.","Родители до сих пор обращаются со мной как с ребёнком."],["Always show respect to everyone, whether they are older than you or not.","Behandle alle mit Respekt, egal ob sie älter sind als du oder nicht.","Всегда относись ко всем с уважением, старше они тебя или нет."],["Bullying is a problem in many schools.","Mobbing ist an vielen Schulen ein Problem.","Травля — проблема во многих школах."],["Smoking can harm the well-being of others.","Rauchen kann das Wohlbefinden anderer beeinträchtigen.","Курение может вредить благополучию других людей."],["Parents often teach their children not to talk to strangers.","Eltern bringen ihren Kindern oft bei, nicht mit Fremden zu sprechen.","Родители часто учат детей не разговаривать с незнакомцами."],["We bumped into Amy when we were in town last week.","Wir sind Amy zufällig begegnet, als wir letzte Woche in der Stadt waren.","На прошлой неделе мы случайно встретили Эми в городе."],["The reconnected after 20 years thanks to a chance meeting at a restaurant.","Dank einer zufälligen Begegnung in einem Restaurant fanden sie nach 20 Jahren wieder zueinander.","Благодаря случайной встрече в ресторане они снова нашли друг друга через 20 лет."]]}]}] },

let C, DATA, WORDS, BYID;

  })));

// ---------- storage ----------
const store = {

};

let opts = Object.assign({ dir: 'en-de', size: '20', autospeak: false, weak: true, view: 'learn', course: 'more1', ui: 'classic', lang: ['de', 'ru'].includes(navLang) ? navLang : 'en' }, store.get('opts', {}));

let sel;
const selKey = () => opts.course === 'more1' ? 'sel' : 'sel:' + opts.course;

}
useCourse(opts.course);
const P = id => prog[id] || (prog[id] = { box: 0, right: 0, wrong: 0 });
function mark(id, ok) {
  const p = P(id);
  if (ok) { p.right++; p.box = Math.min(MAXBOX, p.box + 1); }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pool = () => WORDS.filter(w => sel.has(w.sec));
function pickRound() {
  let p = shuffle(pool().slice());
  if (opts.weak) p.sort((a, b) => (P(a.id).box - P(b.id).box) || ((P(a.id).last || 0) - (P(b.id).last || 0)));
  const n = +opts.size;
  return n ? p.slice(0, n) : p;
}
const DIRS = ['en-de', 'de-en', 'en-ru', 'ru-en', 'de-ru', 'ru-de', 'en~de', 'en~ru', 'de~ru'];
function dirLabel(d) {
  const [a, b] = d.split(/[-~]/);
  return `${T('L_' + a)} ${d.includes('~') ? '⇄' : '→'} ${T('L_' + b)}`;
}
function side(w) {

  if (opts.dir.includes('~') && Math.random() < .5) [from, to] = [to, from];
  return { q: w[from], a: w[to], qk: from, key: to, qlang: VOICE[from], alang: VOICE[to], qtarget: from === targetLang() };
}
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
try { if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } } catch (e) {}
function speak(text, lang) {

    speechSynthesis.cancel();

    u.lang = lang; u.rate = .9;
    const v = voices.find(v => v.lang.replace('_', '-') === lang) || voices.find(v => v.lang.startsWith(lang.slice(0, 2)));

}

// answer checking
function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\(.*?\)/g, '')
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/ё/g, 'е')
    .replace(/[.!?,;:"„“”«»'—–…]/g, ' ').replace(/\s+/g, ' ').trim();
}
const SUFFIX = new Set(['e', 'r', 's', 'n', 'in', 'en', 'er', 'innen']);
// "dir/Ihnen/euch" -> each word; "Pirat/in", "nächste/r/s" -> base + endings
function slashForms(tok) {
  if (!tok.includes('/') || /^\/|\/$/.test(tok)) return [tok];
  const parts = tok.split('/');
  const base = parts[0];
  if (parts.slice(1).every(x => SUFFIX.has(x.toLowerCase()))) return [base, ...parts.slice(1).map(x => base + x)];
  return parts;
}
function expandSlashes(phrase) {
  let combos = [''];
  for (const tok of phrase.split(' ')) {
    const forms = slashForms(tok);
    combos = combos.flatMap(c => forms.map(f => (c ? c + ' ' : '') + f));
    if (combos.length > 64) return [phrase];
  }
  return combos;
}
function variants(expected) {
  const out = new Set([expected]);
  expected.split(/\s*;\s*|\s+\/\s+/).forEach(p => {
    out.add(p);
    expandSlashes(p.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim()).forEach(v => out.add(v));
    // optional parts in brackets: accept with and without them, e.g. "Lasst (uns)", "(mit-)bringen"
    expandSlashes(p.replace(/[()]/g, '').replace(/-\s*(?=\p{L})/u, '').replace(/\s+/g, ' ').trim()).forEach(v => out.add(v));
  });
  const res = new Set();
  out.forEach(v => { const n = norm(v); if (n) { res.add(n); res.add(n.replace(/^to /, '')); res.add(n.replace(/^(the|a|an|der|die|das) /, '')); } });
  return res;
}
function isCorrect(input, expected) {
  const v = variants(expected);
  const n = norm(input);
  if (!n) return false;
  const tries = [n, n.replace(/^(to|der|die|das|ein|eine|a|an|the) /, '')];
  return tries.some(t => v.has(t) || v.has('to ' + t));
}

function treeEvents() {

}

function progressBar(i, n, label) {
  return `<div class="prog"><span>${label}</span><div class="bar sunken" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><b style="width:${n ? i / n * 100 : 0}%"></b></div><span>${i}/${n}</span></div>`;
}
function cardHTML(w, sd, showA) {
  const long = sd.q.length > 40 || sd.a.length > 40 ? ' long' : '';
  return `<div class="card${long}">
    <div class="where"><span>${UW()} ${w.unit}: ${esc(w.st)}</span>${boxes(P(w.id).box)}</div>
    <div class="zone zq lang-${sd.qk}">
      <div class="langtag">${T('L_' + sd.qk)}</div>
      <div class="q" lang="${sd.qk}">${esc(sd.q)}</div>
      <button class="spk" id="say" aria-label="${T('readAloud')}">🔊</button>
    </div>
    <div class="zone za lang-${sd.key}">
      <div class="langtag">${T('L_' + sd.key)}</div>
      <div class="a ${showA ? 'flipin' : 'hidden'}" lang="${sd.key}" aria-hidden="${!showA}">${showA ? esc(sd.a) : '?'}</div>
    </div>
  </div>`;
}
function summary(title, right, total, again) {
  const pct = total ? Math.round(right / total * 100) : 0;
  const msg = pct === 100 ? T('perfect') : pct >= 80 ? T('veryGood') : pct >= 50 ? T('goodStart') : T('newWords');
  $('#view').onclick = null;
  $('#view').innerHTML = `<div class="dialog raised"><div class="titlebar"><span class="name">${title}</span></div><div class="body">
    <p class="big">${T('rightOf', right, total, pct)}</p><p>${msg}</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn raised default" id="again">${T('newRound')}</button><button class="btn raised" id="tostats">${T('seeStats')}</button></div></div></div>`;
  $('#again').onclick = again; $('#again').focus({ preventScroll: true });
  $('#tostats').onclick = () => setView('stats');
  keyHandler = e => { if (e.key === 'Enter') { e.preventDefault(); again(); } };
}

// Flashcards
function viewLearn() {
  const round = pickRound();
  if (!round.length) { $('#view').innerHTML = emptyMsg(); return; }
  S = { queue: round.map(w => w.id), total: round.length, done: 0, firstRight: 0, missed: new Set() };
  nextCard();
}
function nextCard() {
  if (!S.queue.length) return summary(T('doneLearn'), S.firstRight, S.total, viewLearn);
  const w = BYID[S.queue[0]]; const sd = side(w); let shown = false;
  const draw = () => {
    $('#view').innerHTML = `<div class="stage">${progressBar(S.done, S.total, T('round'))}
      ${cardHTML(w, sd, shown)}
      <div class="actions">${shown
        ? `<button class="btn raised" id="no">${T('dontKnow')}</button><button class="btn raised default" id="yes">${T('knew')}</button>`
        : `<button class="btn raised default" id="show">${T('showAns')}</button>`}</div>
      <div class="kbd">${shown ? T('keysLearn') : T('keySpace')}</div></div>`;
    $('#say').onclick = () => speak(shown ? sd.a : sd.q, shown ? sd.alang : sd.qlang);
    if (shown) { $('#yes').onclick = () => answer(true); $('#no').onclick = () => answer(false); $('#yes').focus({ preventScroll: true }); }
    else { $('#show').onclick = reveal; $('#show').focus({ preventScroll: true }); }
  };
  const reveal = () => { shown = true; draw(); if (opts.autospeak) sayTarget(w); };
  const answer = ok => {
    S.queue.shift();
    if (ok) { S.done++; if (!S.missed.has(w.id)) { S.firstRight++; mark(w.id, true); } }
    else { S.missed.add(w.id); mark(w.id, false); S.queue.splice(Math.min(3, S.queue.length), 0, w.id); }
    nextCard();
  };
  keyHandler = e => {
    if (!shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
    else if (shown && e.key === '1') answer(false);
    else if (shown && e.key === '2') answer(true);
  };
  draw();
  if (opts.autospeak && sd.qtarget) sayTarget(w);
}

// Multiple choice
function viewQuiz() {
  const round = pickRound();
  if (!round.length) { $('#view').innerHTML = emptyMsg(); return; }
  S = { list: round, i: 0, right: 0 };
  nextQuiz();
}
function nextQuiz() {
  $('#view').onclick = null;
  if (S.i >= S.list.length) return summary(T('doneQuiz'), S.right, S.list.length, viewQuiz);
  const w = S.list[S.i]; const sd = side(w);
  const correct = w[sd.key];
  // never offer a distractor that is also a correct translation of the question
  const okAlso = x => x[sd.key] !== correct && norm(x[sd.qk]) !== norm(w[sd.qk]);
  const same = shuffle(WORDS.filter(x => x.sec === w.sec && okAlso(x)));
  const other = shuffle(WORDS.filter(x => x.sec !== w.sec && okAlso(x)));
  const opts4 = [correct];
  for (const x of same.concat(other)) { if (opts4.length >= 4) break; if (!opts4.includes(x[sd.key])) opts4.push(x[sd.key]); }
  shuffle(opts4);
  let done = false;
  const advance = () => { S.i++; nextQuiz(); };
  $('#view').innerHTML = `<div class="stage">${progressBar(S.i, S.list.length, T('score', S.right))}
    ${cardHTML(w, sd, false)}
    <div class="choices lang-${sd.key}">${opts4.map((o, k) => `<button class="choice raised" data-k="${k}" lang="${sd.key}"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="actions"><button class="btn raised default" id="next" disabled>${T('next')}</button></div>
    <p class="tapnext hint" id="tapnext" hidden>${T('tapNext')}</p>
    <div class="kbd">${T('keysQuiz')}</div></div>`;
  $('#say').onclick = e => { e.stopPropagation(); speak(sd.q, sd.qlang); };
  const pick = k => {
    if (done) return; done = true;
    const ok = opts4[k] === correct;
    if (ok) S.right++;
    mark(w.id, ok);
    document.querySelectorAll('.choice').forEach((b, j) => {
      b.disabled = true;
      if (opts4[j] === correct) b.classList.add('right'); else if (j === k) b.classList.add('wrong');
    });
    const a = document.querySelector('.card .a'); a.className = 'a flipin'; a.textContent = correct; a.setAttribute('aria-hidden', 'false');
    if (opts.autospeak) sayTarget(w);
    $('#next').disabled = false; $('#tapnext').hidden = false; $('#next').focus({ preventScroll: true });
    // the next tap or click anywhere in the practice area moves on
    setTimeout(() => { $('#view').onclick = e => { if (e.target.closest('#say')) return; advance(); }; }, 0);
  };
  document.querySelectorAll('.choice').forEach(b => b.onclick = e => { if (!done) { e.stopPropagation(); pick(+b.dataset.k); } });
  keyHandler = e => {
    if (!done && /^[1-4]$/.test(e.key)) pick(+e.key - 1);
    else if (done && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
  };
  if (opts.autospeak && sd.qtarget) sayTarget(w);
}

// Writing test
function viewWrite() {
  const round = pickRound();
  if (!round.length) { $('#view').innerHTML = emptyMsg(); return; }
  S = { list: round, i: 0, right: 0 };
  nextWrite();
}
function nextWrite() {
  if (S.i >= S.list.length) { kbBlur(); return summary(T('doneWrite'), S.right, S.list.length, viewWrite); }
  const w = S.list[S.i]; const sd = side(w); let state = 'ask', wasOk = false;
  $('#view').innerHTML = `<div class="stage">${progressBar(S.i, S.list.length, T('score', S.right))}
    ${cardHTML(w, sd, false)}
    <div class="answer lang-${sd.key}"><input id="inp" type="text" lang="${sd.key}" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="${T('typeIn_' + sd.key)}" placeholder="${T('typeIn_' + sd.key)}"><button class="btn raised default" id="chk">${T('check')}</button></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="kbd">${T('enterHint')}${sd.key === 'de' ? ' ' + T('umlautHint') : ''}</div></div>`;
  const inp = $('#inp');
  const keepTyping = () => { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } };
  keepTyping();
  $('#say').onclick = () => speak(sd.q, sd.qlang);
  const go = () => {
    if (state === 'ask') {
      if (!inp.value.trim()) { $('#fb').className = 'feedback'; $('#fb').textContent = T('typeFirst'); state = 'empty'; keepTyping(); return; }
      check();
    } else if (state === 'empty') check();
    else { S.i++; nextWrite(); }
  };
  const check = () => {
    const prevBox = P(w.id).box;
    wasOk = isCorrect(inp.value, sd.a);
    const art = sd.key === 'de' && /^(der|die|das) /i.test(sd.a) && !/^(der|die|das) /i.test(inp.value.trim());
    if (wasOk) S.right++;
    mark(w.id, wasOk);
    state = 'done';
    inp.classList.add('locked');
    const a = document.querySelector('.card .a'); a.className = 'a flipin'; a.textContent = sd.a; a.setAttribute('aria-hidden', 'false');
    $('#fb').className = 'feedback ' + (wasOk ? 'ok' : 'bad');
    $('#fb').innerHTML = wasOk ? (art ? `✓ ${T('rightArticle')} <b>${esc(sd.a)}</b>` : `✓ ${T('right')} <b>${esc(sd.a)}</b>`) :
      `✗ ${T('answerIs')} <b>${esc(sd.a)}</b>. <button class="btn raised" id="override">${T('override')}</button>`;
    $('#chk').textContent = T('nextWord');
    if (!wasOk) $('#override').onclick = () => {
      S.right++; const p = P(w.id); p.wrong = Math.max(0, p.wrong - 1); p.box = prevBox; mark(w.id, true);
      $('#fb').className = 'feedback ok'; $('#fb').innerHTML = `✓ ${T('counted')} <b>${esc(sd.a)}</b>`; keepTyping();
    };
    if (opts.autospeak) sayTarget(w);
    // keep focus in the field so an on-screen keyboard stays open; Return/Go moves on
    keepTyping();
  };
  inp.addEventListener('beforeinput', e => { if (state === 'done') e.preventDefault(); });
  $('#chk').onclick = go;
  keyHandler = e => { if (e.key === 'Enter' && e.target.id !== 'override') { e.preventDefault(); go(); } };
  if (opts.autospeak && sd.qtarget) sayTarget(w);
}

// Statistics
const BOXCOL = ['var(--b0)', 'var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b4)', 'var(--b5)'];
function viewStats() {
  const BOXNAME = T('boxNames');
  const all = WORDS.map(w => P(w.id));
  const seen = all.filter(p => p.right + p.wrong > 0).length;
  const learned = all.filter(p => p.box >= MAXBOX).length;
  const r = all.reduce((s, p) => s + p.right, 0), wr = all.reduce((s, p) => s + p.wrong, 0);
  const row = (label, ws) => {
    const c = [0, 0, 0, 0, 0, 0]; ws.forEach(w => c[P(w.id).box]++);
    const l = c[MAXBOX];
    return `<div class="urow"><span>${label}</span><div class="stack sunken" aria-label="${T('learnedAria', l, ws.length)}">${[5, 4, 3, 2, 1, 0].map(i => c[i] ? `<span style="width:${c[i] / ws.length * 100}%;background:${BOXCOL[i]}" title="${BOXNAME[i]}: ${c[i]}"></span>` : '').join('')}</div><span>${Math.round(l / ws.length * 100)}%</span></div>`;
  };
  const hard = WORDS.filter(w => P(w.id).wrong > 0).sort((a, b) => P(b.id).wrong - P(a.id).wrong).slice(0, 10);
  $('#view').innerHTML = `
    <div class="statgrid">
      <div class="raised">${T('statWords')}<b>${WORDS.length}</b></div>
      <div class="raised">${T('practised')}<b>${seen}</b></div>
      <div class="raised">${T('learned')}<b>${learned}</b></div>
      <div class="raised">${T('accuracy')}<b>${r + wr ? Math.round(r / (r + wr) * 100) : 0}%</b></div>
    </div>
    <div class="groupt">${T('progressBy')}</div>
    ${DATA.map(u => row(`${UW()} ${u.n}: ${esc(u.t)}`, WORDS.filter(w => w.unit === u.n))).join('')}
    <div class="legend">${[5, 4, 3, 2, 1, 0].map(i => `<span><i style="background:${BOXCOL[i]}"></i>${BOXNAME[i]}</span>`).join('')}</div>
    <p class="hint">${T('levelsHint')}</p>
    <div class="groupt">${T('missMost')}</div>
    ${hard.length ? `<div class="tablewrap"><table><thead><tr>${LANGS.map(l => `<th class="c-${l}">${T('L_' + l)}</th>`).join('')}<th>${T('missed')}</th></tr></thead><tbody>${hard.map(w => `<tr>${LANGS.map(l => `<td>${esc(w[l])}</td>`).join('')}<td>${P(w.id).wrong}×</td></tr>`).join('')}</tbody></table></div>` : `<p class="hint">${T('nothingYet')}</p>`}
    <p style="margin-top:18px"><button class="btn raised" id="reset">${T('reset')}</button> <span class="hint" id="rh"></span></p>`;
  let armed = false;
  $('#reset').onclick = () => {
    if (!armed) { armed = true; $('#reset').textContent = T('resetYes'); $('#rh').textContent = T('resetWarn'); return; }
    prog = {}; store.set('progress', prog); status(); viewStats();
  };
}

// ---------- keyboards ----------
const root = document.documentElement;
// a key press outside a text field can only come from a hardware keyboard: show shortcut hints from then on
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!(t.tagName === 'INPUT' && t.type !== 'checkbox') && t.tagName !== 'SELECT' && t.tagName !== 'TEXTAREA') root.classList.add('has-kb');
}, true);
// on-screen keyboard: when it covers a big part of the screen while typing, switch to a compact layout
function kbCheck() {
  const vv = window.visualViewport; if (!vv) return;
  const a = document.activeElement;
  const typing = a && a.tagName === 'INPUT' && a.type !== 'checkbox';
  const open = typing && window.innerHeight - vv.height > 140;
  if (open !== root.classList.contains('kb-open')) {
    root.classList.toggle('kb-open', open);
    if (open && a.id === 'inp') requestAnimationFrame(() => a.closest('.stage').scrollIntoView({ block: 'start' }));
  }
}
function kbBlur() { root.classList.remove('kb-open'); }
if (window.visualViewport) { visualViewport.addEventListener('resize', kbCheck); }
document.addEventListener('focusout', () => setTimeout(kbCheck, 250));
document.addEventListener('focusin', () => setTimeout(kbCheck, 350));

// ---------- wiring ----------
function setView(v) { opts.view = v; store.set('opts', opts); kbBlur(); render(); }
document.querySelectorAll('.tool').forEach(b => b.onclick = () => setView(b.dataset.view));
function fillDirs() {
  const d = $('#dir');
  d.innerHTML = DIRS.map(x => `<option value="${x}">${dirLabel(x)}</option>`).join('');
  if (!DIRS.includes(opts.dir)) opts.dir = 'en-de';
  d.value = opts.dir;
}
$('#size').value = opts.size; $('#autospeak').checked = opts.autospeak; $('#weak').checked = opts.weak;
$('#dir').onchange = e => { opts.dir = e.target.value; store.set('opts', opts); status(); if (opts.view !== 'browse' && opts.view !== 'stats') render(); };
$('#size').onchange = e => { opts.size = e.target.value; store.set('opts', opts); if (opts.view !== 'browse' && opts.view !== 'stats') render(); };
$('#autospeak').onchange = e => { opts.autospeak = e.target.checked; store.set('opts', opts); };
$('#weak').onchange = e => { opts.weak = e.target.checked; store.set('opts', opts); };
$('#all').onclick = () => { DATA.forEach(u => u.s.forEach((s, i) => sel.add(`${u.n}.${i}`))); selChanged(); };
$('#none').onclick = () => { sel.clear(); selChanged(); };
$('#treetoggle').onclick = () => { const l = $('#left'); l.classList.toggle('closed'); $('#treetoggle').setAttribute('aria-expanded', !l.classList.contains('closed')); };
function typeTip() {
  const k = document.querySelector('.kbd'); if (!k || k.dataset.tip) return;
  k.dataset.tip = '1';
  k.innerHTML = `${T('noTyping')} <button class="btn raised" id="gowrite">${T('nav_write')}</button>`;
  document.getElementById('gowrite').onclick = () => setView('write');
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((opts.view === 'learn' || opts.view === 'quiz') && t.tagName !== 'INPUT' && t.tagName !== 'SELECT' && !e.ctrlKey && !e.metaKey && !e.altKey && /^\p{L}$/u.test(e.key)) typeTip();
  if (!keyHandler) return;
  if (t.tagName === 'SELECT' || t.type === 'checkbox') return;
  if (t.tagName === 'INPUT' && t.id !== 'inp') return;
  if (t.tagName === 'BUTTON' && e.key === ' ' && !t.closest('.view')) return;
  keyHandler(e);
});
const cs = $('#course');
cs.innerHTML = Object.entries(COURSES).map(([k, c]) => `<option value="${k}">${esc(c.name)}</option>`).join('');
cs.value = opts.course;
const setTitle = () => { $('#wintitle').innerHTML = `<span class="app">${T('appName')}</span><span class="sub">${esc(C.title)}</span>`; document.title = T('appName') + ' – ' + C.title; document.querySelector('.win').setAttribute('aria-label', T('appName')); };
const switchCourse = key => { useCourse(key); store.set('opts', opts); cs.value = key; drawCourses(); setTitle(); buildTree(); status(); render(); };
cs.onchange = e => switchCourse(e.target.value);
function drawCourses() {
  $('#courselist').innerHTML = Object.entries(COURSES).map(([k, c]) => {
    const i = c.name.indexOf(': ');
    const top = i > 0 ? c.name.slice(0, i) : '', main = i > 0 ? c.name.slice(i + 2) : c.name;
    return `<button class="citem" role="radio" aria-checked="${k === opts.course}" data-course="${k}">${top ? `<span class="ctop">${esc(top)}</span>` : ''}<span class="cmain">${esc(main)}</span></button>`;
  }).join('');
}
$('#courselist').onclick = e => { const b = e.target.closest('[data-course]'); if (b && b.dataset.course !== opts.course) switchCourse(b.dataset.course); };
$('#courselist').onkeydown = e => {
  if (!['ArrowDown', 'ArrowUp'].includes(e.key)) return;
  e.preventDefault(); const keys = Object.keys(COURSES); const i = keys.indexOf(opts.course);
  const k = keys[(i + (e.key === 'ArrowDown' ? 1 : -1) + keys.length) % keys.length];
  switchCourse(k); document.querySelector(`[data-course="${k}"]`).focus();
};
drawCourses();
const THEMECOLOR = { classic: '#3a6ea5', light: '#ECEEF3', dark: '#0D121D' };
function applyTheme() {
  if (opts.ui === 'classic') { delete root.dataset.ui; delete root.dataset.theme; }
  else { root.dataset.ui = 'modern'; root.dataset.theme = opts.ui; }
  $('#theme').value = opts.ui;
  const m = document.getElementById('tc'); if (m) m.setAttribute('content', THEMECOLOR[opts.ui]);
}
$('#theme').onchange = e => { opts.ui = e.target.value; store.set('opts', opts); applyTheme(); };
$('#lang').onchange = e => { opts.lang = e.target.value; store.set('opts', opts); applyLang(); fillDirs(); setTitle(); buildTree(); status(); render(); };
applyTheme(); applyLang(); fillDirs(); setTitle(); treeEvents(); buildTree(); status(); render();

</script>
</body>
